databaseChangeLog:
  - changeSet:
      id: 0002-01-create-product-groups
      author: codex
      changes:
        - createTable:
            tableName: product_groups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 0002-02-create-product-plans
      author: codex
      changes:
        - createTable:
            tableName: product_plans
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: plan_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: plan_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: product_plans
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_plans_product
        - addForeignKeyConstraint:
            baseTableName: product_plans
            baseColumnNames: group_id
            referencedTableName: product_groups
            referencedColumnNames: id
            constraintName: fk_product_plans_group
        - createIndex:
            tableName: product_plans
            indexName: idx_product_plans_product_id
            columns:
              - column:
                  name: product_id
