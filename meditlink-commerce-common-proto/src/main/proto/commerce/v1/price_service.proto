syntax = "proto3";

package commerce.v1;

option java_package = "com.meditlink.poc.commerce.common.proto.v1";
option java_multiple_files = true;

// 가격 계산은 ProductService에서 분리해 PriceService로 독립시킴
// 이유: 이후 가격 정책/프로모션 엔진 분리 시 계약 진화를 쉽게 하기 위함
service PriceService {
  rpc CalculatePrice(CalculatePriceRequest) returns (CalculatePriceResponse);
}

message CalculatePriceRequest {
  string product_id = 1;
  string coupon_code = 2;
}

message CalculatePriceResponse {
  string product_id = 1;
  int64 final_price = 2;
  string currency = 3;
  string applied_coupon_code = 4;
  bool found = 5;
}
