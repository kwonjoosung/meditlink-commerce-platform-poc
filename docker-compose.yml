services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: meditlink-kafka
    environment:
      # KRaft 모드 (Zookeeper 불필요)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: meditlink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meditlink_commerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meditlink_commerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    image: meditlink/commerce-core:local
    container_name: meditlink-commerce-core
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # 컨테이너 간 통신은 내부 5432, 호스트 매핑만 5433
      DB_NAME: meditlink_commerce
      DB_SCHEMA: core
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_LIQUIBASE_ENABLED: "false"
      SERVER_PORT: 8081
      GRPC_SERVER_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
      - "9090:9090"

  client:
    image: meditlink/commerce-client:local
    container_name: meditlink-commerce-client
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meditlink_commerce
      DB_SCHEMA: client
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_LIQUIBASE_ENABLED: "false"
      SERVER_PORT: 8080
      CORE_GRPC_HOST: core
      CORE_GRPC_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

volumes:
  postgres_data:
