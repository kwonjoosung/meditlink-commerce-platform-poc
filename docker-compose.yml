services:
  postgres:
    image: postgres:16-alpine
    container_name: meditlink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meditlink_commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meditlink_commerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    image: meditlink/commerce-core:local
    container_name: meditlink-commerce-core
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meditlink_commerce
      DB_SCHEMA: core
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8081
      GRPC_SERVER_PORT: 9090
    ports:
      - "8081:8081"
      - "9090:9090"

  client:
    image: meditlink/commerce-client:local
    container_name: meditlink-commerce-client
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meditlink_commerce
      DB_SCHEMA: client
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      CORE_GRPC_HOST: core
      CORE_GRPC_PORT: 9090
    ports:
      - "8080:8080"

volumes:
  postgres_data:
